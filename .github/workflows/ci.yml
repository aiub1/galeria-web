name: CI

# develop = integração (destino usual de PR de feature); master = produção
# (só recebe PR de release develop → master). Ver CONTRIBUTING.md.
#
# Deploy fica com a integração nativa da Vercel — nenhum workflow aqui cuida
# disso.

on:
  pull_request:
    branches: [develop, master]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Título do PR (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          scopes: |
            ui
            auth
            gallery
            upload
            search
            admin
            api
            ci
            docs
            deps
            repo
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "o assunto deve começar com minúscula (CONTRIBUTING.md)"

  build:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://dummy.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      FACE_SERVICE_URL: https://dummy.invalid
      FACE_SERVICE_TOKEN: dummy-token
      R2_ACCOUNT_ID: dummy-account
      R2_ACCESS_KEY_ID: dummy-key-id
      R2_SECRET_ACCESS_KEY: dummy-secret
      R2_BUCKET: dummy-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # next-env.d.ts (referenced by tsconfig) is generated by Next.js itself —
      # `next typegen` produces it without a full build, so tsc --noEmit works
      # on a fresh checkout. See node_modules/next/dist/docs/.../next.md.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  env-boundaries:
    name: Fronteira de variáveis de servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhuma variável de servidor com prefixo NEXT_PUBLIC_
        run: |
          pattern='NEXT_PUBLIC_(SUPABASE_SERVICE_ROLE_KEY|FACE_SERVICE_URL|FACE_SERVICE_TOKEN|R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET)'
          if grep -rEn "$pattern" --include='*.ts' --include='*.tsx' --include='*.env*' . \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git; then
            echo "::error::variável de servidor referenciada com prefixo NEXT_PUBLIC_"
            exit 1
          fi
      - name: SUPABASE_SERVICE_ROLE_KEY só em lib/env.server.ts e lib/supabase/admin.ts
        run: |
          hits="$(grep -rln 'SUPABASE_SERVICE_ROLE_KEY' \
            --include='*.ts' --include='*.tsx' . \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
            | grep -v -E '^\./lib/env\.server\.ts$|^\./lib/supabase/admin\.ts$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY referenciada fora de lib/env.server.ts / lib/supabase/admin.ts:"
            echo "$hits"
            exit 1
          fi
